# Quickly on Dokploy (Vonative fork).
#
# - Postgres is a separate Dokploy-managed database service (so Dokploy backups cover it);
#   set DATABASE_URL to its *internal* URL with the scheme changed to postgresql+asyncpg://
# - No Caddy: Dokploy's Traefik terminates TLS. In Domains, map your host to service `app`,
#   port 8000, HTTPS on (Let's Encrypt).
# - Dokploy builds the app from this repo at the deployed commit. To pin a prebuilt image
#   instead, replace `build:` with `image: ghcr.io/<owner>/quickly-vonative:vonative-<version>`.
# - Run ONE replica only: the send scheduler runs inside the app process, and two
#   replicas could send the same queue slot twice.
#
# Set these in Dokploy → Environment (never commit real values):
#   DATABASE_URL, BASE_URL, QUICKLY_SECRET_KEY, QUICKLY_ENCRYPTION_KEY,
#   GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET
# Optional: OFFICE365_CLIENT_ID, OFFICE365_CLIENT_SECRET, OFFICE365_TENANT_ID, CORS_ORIGINS
#
# Local stacks with bundled Postgres/Caddy: docker-compose.no-caddy.yml, docker-compose-not-host.yml.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL (Dokploy Postgres internal URL, postgresql+asyncpg://)}
      BASE_URL: ${BASE_URL:?set BASE_URL, e.g. https://outreach.example.com}
      QUICKLY_SECRET_KEY: ${QUICKLY_SECRET_KEY:?set QUICKLY_SECRET_KEY}
      QUICKLY_ENCRYPTION_KEY: ${QUICKLY_ENCRYPTION_KEY:?set QUICKLY_ENCRYPTION_KEY}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      OFFICE365_CLIENT_ID: ${OFFICE365_CLIENT_ID:-}
      OFFICE365_CLIENT_SECRET: ${OFFICE365_CLIENT_SECRET:-}
      OFFICE365_TENANT_ID: ${OFFICE365_TENANT_ID:-common}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      QUICKLY_PREBUILT_IMAGE: "1"
      QUICKLY_MODE: production
      # Settings → Backup can also write dumps here (Dokploy's Postgres backups are the primary copy)
      QUICKLY_LOCAL_DISK_BACKUPS: "1"
    volumes:
      - backups:/app/backups
    networks:
      - dokploy-network

volumes:
  backups:

networks:
  dokploy-network:
    external: true
